name: Business pricing integrity R1
on:
  pull_request:
    paths:
      - "src/components/proposals/CreateProposalDialog.tsx"
      - "src/lib/proposal-business-*"
      - "src/lib/business-comparison-option-preview.ts"
      - "src/lib/__tests__/business-comparison-option-preview.test.ts"
      - "src/lib/award-financial-integrity.ts"
      - "src/lib/renewal-baseline.ts"
      - "src/lib/__tests__/renewal-baseline.test.ts"
      - "supabase/migrations/*fin02*"
      - "src/lib/__tests__/award-financial-integrity.test.ts"
      - "src/lib/lifecycle-engine.ts"
      - "src/lib/__tests__/proposal-business-persistence.test.ts"
      - "src/lib/__tests__/r1-pricing-to-award-seam.test.ts"
      - ".github/workflows/business-pricing-integrity-r1.yml"
  workflow_dispatch:

jobs:
  financial-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: R1 financial persistence tests
        run: npm test -- src/lib/__tests__/proposal-business-persistence.test.ts
      - name: FIN02 award integrity tests
        run: npm test -- src/lib/__tests__/award-financial-integrity.test.ts
      - name: FIN01 to FIN02 saved pricing/award R1 seam
        run: npm test -- src/lib/__tests__/r1-pricing-to-award-seam.test.ts
      - name: FIN02 Gate5C two-alternative deterministic UI preview and negative tests
        run: npm test -- src/lib/__tests__/business-comparison-option-preview.test.ts
      - name: FIN02 renewal price and legacy regression tests
        run: npm test -- src/lib/__tests__/renewal-baseline.test.ts
      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.app.json
