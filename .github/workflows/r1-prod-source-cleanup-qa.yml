# QA of candidate merge for R1 cleanup only. This workflow never deploys or
# connects to TEST/PROD, and is not a substitute for a production release gate.
name: R1 PROD source cleanup QA
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r1-prod-source-cleanup-qa.yml'
      - 'drizzle/**'
      - 'drizzle.config.ts'
      - 'package.json'
      - 'bun.lock'
      - 'src/**'
      - 'tests/sql/fin02/**'
      - 'tests/sql/commercial_addition_lifecycle*'
      - 'supabase/migrations/*commercial_addition*'
      - 'docs/qa/fin02-test-dual-migration-journal-reconciliation-20261013.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addition-lifecycle:
    name: Isolated addition adjudication and activation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-qa-only
          POSTGRES_DB: additions_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic SQL cases; no TEST or PROD access
        env:
          PGPASSWORD: synthetic-qa-only
        run: psql -h 127.0.0.1 -U postgres -d additions_qa -v ON_ERROR_STOP=1 -f tests/sql/commercial_addition_lifecycle_qa.sql
  candidate-merged-tree:
    name: Verify Lovable scaffold gone; PR49 and PR51 preserved
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check merged candidate tree without secrets or DB calls
        shell: bash
        run: |
          set -euo pipefail
          test ! -f drizzle.config.ts
          test ! -d drizzle/migrations
          test ! -f drizzle/schema.ts
          test -f src/components/BrandLoadingMark.tsx
          test -f src/components/BrandLoadingMark.css
          test -f src/components/BrandMark.tsx
          test -f src/components/BrandMark.test.tsx
          test -f src/pages/Auth.tsx
          # PR51: transparent vector for static branding + favicon must survive the merge.
          test -f public/partneros-mark.svg
          grep -Fq '/partneros-mark.svg?v=2' index.html
          grep -Fq '"/partneros-mark.svg"' src/components/BrandMark.tsx
          test -f tests/sql/fin02/fin02_test_dual_journal_preflight.sql
          test -f tests/sql/fin02/fin02_test_dual_journal_postflight.sql
          python3 - <<'PY'
          import json
          with open("package.json", encoding="utf-8") as f:
              package=json.load(f)
          deps={**package.get("dependencies",{}),**package.get("devDependencies",{})}
          unexpected={"drizzle-kit","drizzle-orm","postgres"}&deps.keys()
          assert not unexpected, f"Unexpected Lovable migration tool dependencies: {unexpected}"
          print("PASS: Unrequested Lovable scaffold removed; PR49 loading and PR51 transparent branding retained")
          PY
  frontend-regression:
    name: TypeScript, auth brand regression and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm test -- src/components/BrandMark.test.tsx
      - name: Commercial additions and proposal document regressions
        run: npm test -- src/lib/__tests__/commercial-additions.test.ts src/components/proposals/CommercialAdditionDialog.test.tsx src/lib/__tests__/proposal-business-snapshot.test.tsx src/lib/__tests__/proposal-source-client.test.ts src/lib/proposal-workflow.terms.test.ts src/lib/__tests__/licensing.test.ts src/lib/__tests__/proposal-reopen.test.ts
      - run: npm run build
      - name: Addition follow-up regression
        run: npm test -- src/lib/__tests__/commercial-addition-workflow.test.ts src/components/proposals/CommercialAdditionWorkflow.test.tsx
